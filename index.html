<!doctype html>
<html lang="ko">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Collapse Lab · 건물 붕괴 시뮬레이션</title>
  </head>
  <body>
    <div id="app">

      <!-- A(render/)가 3D 캔버스를 붙이는 오른쪽 화면 -->
      <main id="viewport" aria-label="3D 화면"></main>
    </div>
    <!-- BASE: ?debug=1 일 때 FPS · 부재 수 표시 -->
    <div id="debug" hidden></div>
